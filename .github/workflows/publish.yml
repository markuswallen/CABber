name: Publish NuGet Package
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet restore CABber.sln
      - run: dotnet build CABber.sln -c Release --no-restore
      - run: dotnet test CABber.sln -c Release --no-build
      - run: dotnet pack src/CABber/CABber.csproj -c Release --no-build -o ./nupkg
      - uses: actions/upload-artifact@v4
        with: { name: nuget-package, path: ./nupkg/* }
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate